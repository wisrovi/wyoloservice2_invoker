version: '3.8'

services:
  worker:
    image: wisrovi/train_service:worker_invoker_v1.0.0
    container_name: wyolo_invoker_${WORKER_NAME}
    hostname: wyolo_invoker_${WORKER_NAME}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 300M
    # Affinity can be set via env var, defaults to 0 if not provided
    cpuset: ${CORE_ASSIGNED:-0}
    environment:
      - WORKER_NAME=${WORKER_NAME}
    env_file:
      - ./control_host.env
      - ./user.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/wyolo/request:/wyolo/worker/request
      - /home/wyolo/train_service_results:/home/wyolo/train_service_results
    labels:
      - "autoheal=true"
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "celery", "-A", "worker_gpu", "inspect", "ping", "-d", "celery@worker_${WORKER_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      celery -A worker_gpu worker -Q ${WORKER_NAME},gpus_high,gpus_medium,gpus_low
      --loglevel=info --concurrency=1 --prefetch-multiplier=1 -Ofair
      --max-tasks-per-child=1 --max-memory-per-child=250000
      --without-gossip --without-mingle --without-heartbeat
    networks:
      - train_service

networks:
  train_service:
    name: train_service
    external: true
