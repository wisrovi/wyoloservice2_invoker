version: '3.8'

services:
  dashboard:
    image: wisrovi/train_service:worker_invoker_dashboard_v1.0.0
    container_name: dashboard_${WORKER_NAME:-default}
    restart: always
    ports:
      - "8082:8000"
    env_file:
      - ./control_host.env
      - ./user.env
    command: uvicorn dashboard_app:app --host 0.0.0.0 --port 8000
    networks:
      - train_service

  gradio_launcher:
    image: wisrovi/train_service:worker_invoker_gradio_v1.0.0
    container_name: gradio_launcher_${WORKER_NAME:-default}
    restart: always
    ports:
      - "8083:7860"
    env_file:
      - ./control_host.env
      - ./user.env
    volumes:
      - /home/wyolo/train_service_results:/results
    networks:
      - train_service

networks:
  train_service:
    name: train_service
    external: true
