# Configuration for manual tests of the Invoker
# This file configures how the send_task.py script connects to Celery

redis:
  host: "192.168.10.252"   # Redis Host
  port: 23437             # Redis Port (from docker-compose)
  db: 0                   # Redis Database

celery:
  queue: "192.168.1.68"      # Queue where the invoker is listening
  task_name: "tasks.train_on_gpu"  # Task name

# Optional configuration to wait for result
wait_result:
  timeout: 600           # Timeout in seconds (10 minutes)
  interval: 5            # Polling interval in seconds
