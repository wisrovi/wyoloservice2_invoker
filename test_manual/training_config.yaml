# Simplified training configuration
# This is the YAML that the Invoker uses for training (similar to the user's config_train.yaml)

# Training data (values for this specific trial)
train:
  model: "yolov8n-cls.pt"      # YOLO base model
  data: "/dataset/"            # Path to dataset
  epochs: 10                   # Number of epochs (reduced for quick test)
  imgsz: 640                   # Image size
  batch: 0.85                  # VRAM fraction
  lr0: 0.01                    # Initial learning rate
  lrf: 0.01                    # Final learning rate
  dropout: 0.0                 # Dropout rate
  cos_lr: true                 # Cosine annealing
  workers: 4                   # Dataloader workers

# Study configuration (for Optuna)
study:
  name: "test_manual_study"    # Study name
  direction: "maximize"        # maximize or minimize
  n_trials: 1                  # Number of trials (1 for test)
  sampler: "TPESampler"       # Sampling algorithm

# Metadata
metadata:
  author: "test_user"
  description: "Manual test of the invoker-executor system"
